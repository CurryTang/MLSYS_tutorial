[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrainlab"
version = "0.1.0"
description = "Local LLM training control plane: gang scheduling, queues, checkpoints, faults."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llmctl = "llmtrainlab.cli:main"

[tool.setuptools.packages.find]
include = ["llmtrainlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
